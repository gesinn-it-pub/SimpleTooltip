version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # mediawiki-codesniffer 52+ needs PHP 8.3, but the MediaWiki 1.39 CI leg runs on PHP 8.2
      - dependency-name: "mediawiki/mediawiki-codesniffer"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # eslint 9+ needs the flat config format and a matching eslint-config-wikimedia
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # MediaWiki still ships jQuery 3; the tests should run against the same major version
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
